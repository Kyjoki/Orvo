/* Orvo pixel office: the dashboard layout and its controls remain intact. */
.scene{aspect-ratio:580/480;background:#13171F;border:1px solid var(--line);border-radius:12px;overflow:hidden;isolation:isolate}
.scene>svg.pixel-office{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.scene .pixel-office{shape-rendering:crispEdges}
.scene .tag{border-radius:7px;min-width:142px;max-width:180px;padding:6px 8px;gap:2px;box-shadow:0 3px 0 #0003}
.scene .tag-n{font-size:12px}.scene .tag-r{font-size:11px}.scene .tag-s{font-size:10.5px}
.scene .hit{top:auto;width:12%;height:18%;border-radius:0}
.scene .tag.sel,.scene .mt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--acc),0 3px 0 #0003}
.scene .tag::after{width:6px;height:6px;bottom:-4px}
.scene .pixel-person{transform-box:fill-box;transform-origin:50% 100%}
.scene .pixel-run .pixel-hands{animation:pixel-type .24s steps(2,end) infinite}
.scene .pixel-run{animation:pixel-breathe 2s steps(2,end) infinite}
.scene .pixel-idle{animation:pixel-idle 7s steps(8,end) infinite}
.scene .pixel-code{animation:pixel-screen 2.4s steps(2,end) infinite}
.scene .pixel-code:nth-child(even){animation-delay:.7s}
.scene .pixel-waiting{animation:pixel-wait 1.8s steps(2,end) infinite}
